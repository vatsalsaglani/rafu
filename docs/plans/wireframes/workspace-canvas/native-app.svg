"/><text x="495" y="127" fill="#e7ae59" font-family="system-ui,sans-serif" font-size="11">Checkout flow</text><rect x="643" y="105" width="115" height="35" rx="0" fill="#10151e" stroke="#3e4b61"/><text x="655" y="127" fill="#a7b5ca" font-family="system-ui,sans-serif" font-size="11">Settings</text><rect x="192" y="151" width="138" height="28" rx="4" fill="#202838" stroke="#3e4b61"/><text x="201" y="170" fill="#e1e8f4" font-family="system-ui,sans-serif" font-size="11">← Back to Canvas</text><text x="350" y="170" fill="#e1e8f4" font-family="system-ui,sans-serif" font-size="13">▣ Simulator · Checkout</text><text x="930" y="170" fill="#e7ae59" font-family="system-ui,sans-serif" font-size="12">Preview · 100%</text><rect x="216" y="205" width="430" height="320" rx="8" fill="#1c2330" stroke="#3e4b61"/><rect x="364" y="231" width="136" height="261" rx="18" fill="#eeece6" stroke="#778294"/><text x="382" y="268" fill="#3c483f" font-family="system-ui,sans-serif" font-size="11">FIELD STORE</text><text x="381" y="306" fill="#35463b" font-family="system-ui,sans-serif" font-size="18">Your order</text><rect x="383" y="328" width="98" height="70" rx="4" fill="#c7ccbe" stroke="#c7ccbe"/><text x="380" y="422" fill="#35463b" font-family="system-ui,sans-serif" font-size="10">Canvas bag · $28</text><text x="681" y="239" fill="#e1e8f4" font-family="system-ui,sans-serif" font-size="18">See one selected window.</text><text x="681" y="271" fill="#a7b5ca" font-family="system-ui,sans-serif" font-size="12">The system picker controls capture.</text><text x="681" y="299" fill="#a7b5ca" font-family="system-ui,sans-serif" font-size="12">No keyboard input goes into the preview.</text><rect x="681" y="329" width="114" height="28" rx="4" fill="#202838" stroke="#3e4b61"/><text x="690" y="348" fill="#e1e8f4" font-family="system-ui,sans-serif" font-size="11">Stop Preview</text><rect x="805" y="329" width="121" height="28" rx="4" fill="#e7ae59" stroke="#e7ae59"/><text x="814" y="348" fill="#201a10" font-family="system-ui,sans-serif" font-size="11">Open App ↗</text><text x="681" y="400" fill="#e1e8f4" font-family="system-ui,sans-serif" font-size="13">Open App switches to the real app.</text><text x="681" y="429" fill="#a7b5ca" font-family="system-ui,sans-serif" font-size="12">Use macOS to return to Rafu.</text><text x="681" y="457" fill="#a7b5ca" font-family="system-ui,sans-serif" font-size="12">Closing this card leaves the app open.</text><text x="207" y="573" fill="#a7b5ca" font-family="system-ui,sans-serif" font-size="12">Reference → Choose Window → Preview     ·     Cancel or revoke → App reference</text><text x="28" y="650" fill="#e7ae59" font-family="system-ui,sans-serif" font-size="12">G  Preview is marked.     H  No foreign window embedding.     I  Reopen needs a new window choice.</text></svg>