<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" data-state="working" data-motion="still" style="--rafu-body:#E7EAF2;--rafu-shade:#A9B1C6;--rafu-ink:#151A24;--rafu-thread:#E3A857">
  <title id="title">Rafu</title>
  <desc id="desc">Rafu leaning side to side with narrowed eyes while agents run. A round ball of mending yarn with a darning needle in its top. The thread through the needle is the theme accent. Colours are CSS variables (--rafu-body, --rafu-shade, --rafu-ink, --rafu-thread) that default to the Indigo theme; the app renders the same artwork natively with the active theme.</desc>
  <defs>
    <linearGradient id="body" x1=".2" y1=".1" x2=".85" y2="1">
      <stop offset="0" stop-color="var(--rafu-body)"/><stop offset="1" stop-color="var(--rafu-shade)"/>
    </linearGradient>
    <clipPath id="ball"><ellipse cx="256" cy="300" rx="176" ry="160"/></clipPath>
  </defs>
  <g class="sprite">
    <g class="needle" transform="rotate(-7 300 150)">
      <path d="M300 150 L352 46" fill="none" stroke="var(--rafu-body)" stroke-width="15" stroke-linecap="round"/>
      <circle cx="349" cy="52" r="5.5" fill="var(--rafu-ink)"/>
      <path d="M349 52 C438 44 478 168 430 256 M349 52 C336 40 318 44 312 60" fill="none" stroke="var(--rafu-thread)" stroke-width="11" stroke-linecap="round"/>
    </g>
    <ellipse cx="256" cy="300" rx="176" ry="160" fill="url(#body)"/>
    <ellipse cx="186" cy="208" rx="65" ry="38" fill="#fff" opacity=".28" transform="rotate(-24 186 208)"/>
    <g clip-path="url(#ball)" fill="none" stroke="var(--rafu-thread)" stroke-width="12" stroke-linecap="round">
      <path d="M70 270 C150 330 330 330 442 262" opacity=".55"/>
      <path d="M70 360 C160 410 340 410 442 350" opacity=".55"/>
      <path d="M150 150 C215 215 230 330 206 470" opacity=".35"/>
    </g>
    <g class="gaze">
    <g class="eyes">
      <g class="eye eye-left"><rect x="168" y="259.0" width="38" height="52" rx="19" fill="var(--rafu-ink)"/><circle cx="193" cy="275.0" r="6.5" fill="#fff" opacity=".9"/></g>
      <g class="eye eye-right"><rect x="306" y="259.0" width="38" height="52" rx="19" fill="var(--rafu-ink)"/><circle cx="331" cy="275.0" r="6.5" fill="#fff" opacity=".9"/></g>
    </g>
    </g>
    <ellipse cx="142" cy="344" rx="23" ry="14" fill="var(--rafu-thread)" opacity=".4"/>
    <ellipse cx="370" cy="344" rx="23" ry="14" fill="var(--rafu-thread)" opacity=".4"/>
    <path d="M238 356 L274 356" fill="none" stroke="var(--rafu-ink)" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
